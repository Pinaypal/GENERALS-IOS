name: Build Generals Zero Hour iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build iOS IPA (arm64)
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Checkout DXVK Fork Submodule
        run: |
          echo "Checking out references/fbraz3-dxvk submodule recursively..."
          git submodule update --init --recursive references/fbraz3-dxvk

      - name: Install Build Tools
        run: |
          echo "Installing iOS build prerequisites..."
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Purge any stale Homebrew backup files to prevent inode/hardlink collisions
          rm -rf ~/Library/Caches/Homebrew/Backup 2>/dev/null || true

          # Disable brew auto-update to avoid rebuilding dependencies from source
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          # Meson via pipx (instant, avoids pulling in python3.13 / openssl@4 source rebuilds)
          pipx install meson || true

          # Install packages needed for iOS build
          brew install autoconf-archive glslang xcodegen sdl3 || true

          if ! command -v meson &>/dev/null; then
            brew install meson || true
          fi

          # Ensure essential build tools are present
          MISSING_TOOLS=()
          for tool in cmake ninja pkg-config autoconf automake libtool; do
            if ! command -v "$tool" &>/dev/null; then
              MISSING_TOOLS+=("$tool")
            fi
          done
          if [ ${#MISSING_TOOLS[@]} -gt 0 ]; then
            brew install "${MISSING_TOOLS[@]}"
          fi

          cmake --version | head -1
          ninja --version | head -1
          meson --version | head -1
          xcodegen --version || true

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v5
        with:
          path: ~/VulkanSDK
          key: vulkan-sdk-macos-1.4.341.1

      - name: Install LunarG Vulkan SDK
        if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          echo "Downloading LunarG Vulkan SDK 1.4.341.1..."
          VULKAN_ZIP="/tmp/vulkansdk-macos-1.4.341.1.zip"
          VULKAN_URL="https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip"
          
          curl -fL --retry 3 -o "$VULKAN_ZIP" "$VULKAN_URL"
          mkdir -p /tmp/vulkan-extract
          unzip -q "$VULKAN_ZIP" -d /tmp/vulkan-extract
          
          VULKAN_APP=$(find /tmp/vulkan-extract -name "*.app" -type d | head -1)
          if [ -n "$VULKAN_APP" ]; then
            INSTALLER="$VULKAN_APP/Contents/MacOS/vulkansdk-macOS-1.4.341.1"
            INSTALL_TARGET="$HOME/VulkanSDK/1.4.341.1"
            echo "Running Vulkan SDK installer..."
            "$INSTALLER" --root "$INSTALL_TARGET" --accept-licenses --default-answer --confirm-command install
          fi
          rm -rf /tmp/vulkan-extract "$VULKAN_ZIP"

      - name: Locate Vulkan SDK
        run: |
          SDK_DIR="$HOME/VulkanSDK/1.4.341.1/macOS"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/VulkanSDK/1.4.341.1"
          fi
          echo "VULKAN_SDK=$SDK_DIR" >> $GITHUB_ENV
          echo "Vulkan SDK located at: $SDK_DIR"
          ls -la "$SDK_DIR/lib" || true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'ffc071e0c08432c60c9b64f00334c0227667931b'

      - name: Unshallow vcpkg for versioning
        run: |
          if [ -d "$VCPKG_ROOT/.git" ]; then
            echo "Unshallowing vcpkg repository for manifest version resolution..."
            git -C "$VCPKG_ROOT" fetch --unshallow || true
          fi

      - name: Fetch Dynamic MoltenVK & Stage Fonts
        run: |
          chmod +x scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure CMake (ios-vulkan preset)
        run: |
          NINJA_BIN=$(which ninja || echo "/opt/homebrew/bin/ninja")
          echo "Using ninja at: $NINJA_BIN"
          cmake --preset ios-vulkan -DCMAKE_MAKE_PROGRAM="$NINJA_BIN"

      - name: Compile Generals Zero Hour Engine
        run: |
          cmake --build build/ios-vulkan --target z_generals --config RelWithDebInfo

      - name: Package Unsigned iOS IPA
        run: |
          BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.cnc.generalszh"
          fi
          echo "Packaging Generals Zero Hour IPA with bundle ID: $BUNDLE_ID"
          GX_BUNDLE_ID="$BUNDLE_ID" ./scripts/build/ios/package-ios-zh.sh --dev --unsigned --ipa
          ls -lh build/GeneralsXZH-unsigned.ipa

      - name: Upload Shell IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-Shell-unsigned
          path: build/GeneralsXZH-unsigned.ipa
          retention-days: 7

      - name: Determine Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="v1.0.5-ios"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > /tmp/release_notes.md
          ### Command & Conquer: Generals Zero Hour — iOS Shell IPA (Unsigned)
          
          This is the lightweight compiled iOS IPA (~35 MB) for iPhone and iPad running natively on Apple Silicon with Metal / DXVK / MoltenVK and touch controls.
          
          #### What's New:
          - **Advanced Touch Gestures**: Two-finger 3D camera rotation and instant orientation reset via 2-finger double-tap or 3-finger tap.
          - **Mobile Action Dock**: Collapsible floating action dock with tactile buttons for hotkeys (`ALL`, `STOP`, `SCATTER`, `RADAR EVENT`, `HOME`, and Control Groups `G1`–`G4`).
          - **Dynamic Safe Area Adaptation**: Full 180-degree landscape rotation support querying `SDL_GetWindowSafeArea` dynamically for Dynamic Island and notch margins.
          - **SDL3 Gamepad Controller Support**: Full physical controller support for Backbone One, Razer Kishi, Xbox Wireless, and PlayStation DualSense controllers.
          - **Native Haptic Feedback**: Integrated iOS Taptic Engine feedback on button taps, orders, and selection events.
          - **Dynamic Frame Pacing**: Smooth 120 FPS high-refresh rate in tactical gameplay with 60 FPS power-saving pacing in UI menus.

          #### How to inject your retail game assets on Windows:
          1. Download `GeneralsXZH-unsigned.ipa` below.
          2. Place it in your project folder (`GENERALS-IOS`).
          3. Run in PowerShell:
             ```powershell
             .\scripts\inject-gameres.ps1
             ```
             *The script auto-detects your Steam / EA App / CD installation, injects your files, and creates `GeneralsXZH-ready-to-sideload.ipa`.*
          4. Sideload onto your iPhone or iPad using **Sideloadly**, **AltStore**, or **TrollStore**.
          
          #### How to inject on macOS / Linux:
          ```bash
          ./scripts/inject-gameres.sh
          ```
          EOF

          gh release create "${{ env.RELEASE_TAG }}" \
            --title "Command & Conquer: Generals Zero Hour iOS - Shell IPA (${{ env.RELEASE_TAG }})" \
            --notes-file /tmp/release_notes.md \
            build/GeneralsXZH-unsigned.ipa || \
          gh release upload "${{ env.RELEASE_TAG }}" build/GeneralsXZH-unsigned.ipa --clobber
